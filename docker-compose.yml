services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-soulserve}
      POSTGRES_USER: ${POSTGRES_USER:-soulserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soulserve}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-soulserve}:${POSTGRES_PASSWORD:-soulserve}@postgres:5432/${POSTGRES_DB:-soulserve}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-deploy}
      HTTP_ADDR: :8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

