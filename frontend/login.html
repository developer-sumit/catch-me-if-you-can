<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SoulServe</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="logo-icon">🍽️</div>
      SoulServe
    </a>
    <div class="navbar-links">
      <a href="register.html">Don't have an account? <strong>Register</strong></a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card animate-in">
      <h1>Welcome Back</h1>
      <p class="subtitle">Login to your account</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content: center; margin-top: 0.5rem;">
          Login →
        </button>
      </form>

      <div style="text-align:center; margin-top:1.5rem; color: var(--text-muted); font-size: 0.85rem;">
        <p>Demo Accounts:</p>
        <p>Kitchen: <strong>kitchen1@demo.com</strong></p>
        <p>NGO: <strong>ngo1@demo.com</strong></p>
        <p>Password: <strong>password123</strong></p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const data = await api.post('/auth/login', { email, password });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showToast(`Welcome back, ${data.user.name}!`);

        setTimeout(() => {
          window.location.href = data.user.role === 'kitchen'
            ? '/kitchen/dashboard.html'
            : '/ngo/dashboard.html';
        }, 500);
      } catch (err) {
        showToast(err.message, true);
      }
    });
  </script>
</body>
</html>
