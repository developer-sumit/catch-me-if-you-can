<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — SoulServe</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-card { max-width: 560px; }
    .map-pick { height: 220px; border-radius: var(--radius-md); margin-top: 0.5rem; border: 1px solid var(--border-color); }
    .map-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.35rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  </style>
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <div class="logo-icon">🍽️</div>
      SoulServe
    </a>
    <div class="navbar-links">
      <a href="login.html">Already have an account? <strong>Login</strong></a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card animate-in">
      <h1>Create Account</h1>
      <p class="subtitle">Join the food waste revolution</p>

      <!-- Role Selector -->
      <div class="role-selector">
        <div class="role-option active" data-role="kitchen" onclick="selectRole('kitchen')">
          <div class="role-icon">🍳</div>
          <div class="role-name">Food Provider</div>
        </div>
        <div class="role-option" data-role="ngo" onclick="selectRole('ngo')">
          <div class="role-icon">🏢</div>
          <div class="role-name">Receiver</div>
        </div>
      </div>

      <form id="registerForm">
        <input type="hidden" id="role" value="kitchen">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="organization">Organization Name</label>
            <input type="text" id="organization" class="form-control" placeholder="Provider / Receiver name">
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" class="form-control" placeholder="+91 XXXXXXXXXX">
          </div>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" class="form-control" placeholder="Full address">
        </div>

        <div class="form-group">
          <label>📍 Pin Your Location (click on map)</label>
          <div id="locationMap" class="map-pick"></div>
          <p class="map-hint">Lat: <span id="latDisplay">—</span> | Lng: <span id="lngDisplay">—</span></p>
          <input type="hidden" id="latitude">
          <input type="hidden" id="longitude">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width:100%; justify-content: center; margin-top: 0.5rem;">
          Create Account →
        </button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
  <script>
    redirectIfLoggedIn();

    let selectedRole = 'kitchen';
    let locationMarker = null;

    // Pre-select role from URL
    const params = new URLSearchParams(window.location.search);
    if (params.get('role') === 'ngo') {
      selectRole('ngo');
    }

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('role').value = role;
      document.querySelectorAll('.role-option').forEach(el => {
        el.classList.toggle('active', el.dataset.role === role);
      });
    }

    // Map for location picking
    initPickerMap('locationMap', (lat, lng) => {
      document.getElementById('latitude').value = lat.toFixed(6);
      document.getElementById('longitude').value = lng.toFixed(6);
      document.getElementById('latDisplay').textContent = lat.toFixed(4);
      document.getElementById('lngDisplay').textContent = lng.toFixed(4);
    });

    // Form submit
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
        organization: document.getElementById('organization').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        latitude: parseFloat(document.getElementById('latitude').value) || null,
        longitude: parseFloat(document.getElementById('longitude').value) || null,
      };

      try {
        const data = await api.post('/auth/register', body);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        showToast(`Welcome, ${data.user.name}! Account created.`);

        setTimeout(() => {
          window.location.href = data.user.role === 'kitchen'
            ? '/kitchen/dashboard.html'
            : '/ngo/dashboard.html';
        }, 500);
      } catch (err) {
        showToast(err.message, true);
      }
    });
  </script>
</body>
</html>
